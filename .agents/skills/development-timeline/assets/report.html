*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit;letter-spacing:0}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #35816c;outline-offset:3px}a{color:#176b5e;overflow-wrap:anywhere}svg{flex:none}h1{margin:0;font-size:24px;font-weight:650;line-height:1.4}h2{font-size:18px;margin:0 0 16px;line-height:1.45}h3{font-size:15px;margin:0 0 8px}p{line-height:1.7;margin:0 0 12px;white-space:pre-line;overflow-wrap:anywhere}.muted,.tiny{color:var(--muted)}.tiny{font-size:12px;line-height:1.7}.top{background:#fff;border-bottom:1px solid var(--line);padding:24px 30px 0}.topline{display:flex;justify-content:space-between;gap:24px;align-items:start}.stamp{text-align:right;font-size:12px;line-height:1.8;white-space:pre-line}.project{font-size:12px;color:var(--muted);margin-bottom:6px}.metrics{display:flex;flex-wrap:wrap;gap:28px;margin:24px 0}.metric{padding-right:28px;border-right:1px solid var(--line);min-width:140px}.metric:last-child{border:0}.metric .value{font-size:25px;font-weight:650;line-height:1.3;font-variant-numeric:tabular-nums}.metric .name{font-size:12px;color:var(--muted);margin-top:6px}.tabs{display:flex;gap:24px;overflow-x:auto}.tabs button{padding:13px 0;min-height:44px;border:0;border-bottom:3px solid transparent;background:none;white-space:nowrap;font-weight:600;color:#647168}.tabs button[aria-selected=true]{color:#165c48;border-color:#165c48}[hidden]{display:none!important}main{padding:24px 30px 48px;max-width:1800px;margin:auto}.summary-line{padding:12px 16px;border-left:3px solid #bc8844;background:#fcf4e5;margin-bottom:20px;font-size:13px;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere}.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}.toolbar label{display:flex;align-items:center;gap:8px;min-height:40px;font-size:12px}select,input[type=search],input[type=datetime-local]{border:1px solid #b9c6be;background:#fff;border-radius:4px;min-height:38px;padding:7px 9px;max-width:100%}.searchbox{display:flex;align-items:center;gap:8px;min-width:180px}.searchbox input{width:100%;min-width:0}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;flex:none;border:1px solid #b9c6be;border-radius:4px;background:#fff;color:#334a3e}.icon-button:hover{background:#edf4ef}.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;margin:12px 0 16px}.legend label{display:flex;align-items:center;gap:6px;min-height:32px}.legend input{accent-color:#176f54}.dot{width:9px;height:9px;border-radius:2px;display:inline-block}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}.timeline-frame{background:#fff;border:1px solid var(--line);min-width:0;overflow:hidden;border-radius:4px}.timeline-scroll{overflow:auto;max-height:720px}.timeline{position:relative;background:#fff;min-width:760px}.axis{height:46px;position:sticky;top:0;z-index:4;background:#f1f5f2;border-bottom:1px solid var(--line)}.axis-label{position:sticky;left:0;width:150px;height:46px;background:#f1f5f2;z-index:5;padding:12px;font-size:12px}.axis-time{position:absolute;top:8px;font-size:11px;color:#5f6d64;white-space:nowrap}.axis-day{font-size:10px;display:block;color:#7e8b81}.lane{position:relative;border-bottom:1px solid #e3e8e5}.lane-title{position:sticky;left:0;background:#fff;width:150px;height:100%;z-index:3;border-right:1px solid var(--line);padding:12px;display:flex;align-items:start;font-size:12px;line-height:1.5;font-weight:600;overflow-wrap:anywhere}.lane-events{position:absolute;top:0;left:150px;height:100%;right:0}.gridline{position:absolute;height:100%;top:0;border-left:1px solid #edf0ee;pointer-events:none}.event{position:absolute;border:0;border-radius:3px;min-width:9px;height:26px;text-align:left;padding:4px 7px;font-size:11px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#e7efeb;color:#154733}.event:hover{outline:2px solid #7a9283;z-index:2}.event.selected{outline:2px solid #182d20;z-index:2}.event[data-category=validation]{background:#d8eee4;color:#115a40}.event[data-category=review]{background:#e8def4;color:#674786}.event[data-category=diagnosis]{background:#f2e6d9;color:#80552d}.event[data-category=integration]{background:#dcebf9;color:#245884}.event[data-category=coordination]{background:#e2edef;color:#365e65}.event[data-kind=phase]{border:1px dashed #8fa197}.event[data-kind=wait]{background:#fae7b8;color:#755719;border:1px solid #e1c67a}.event[data-outcome=failed]{background:#f7d9d8;color:#872a2b}.event[data-outcome=expected-red]{background:#f1e4d7;color:#825126}.event[data-kind=point],.event.open{width:10px;padding:0;border-radius:1px}.empty{padding:24px;color:var(--muted)}aside{border-left:1px solid var(--line);padding-left:20px;min-width:0;position:sticky;top:20px}.detail-title{line-height:1.6;overflow-wrap:anywhere}.detail-meta{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;font-size:12px;margin:14px 0;color:#55665b}.detail-meta dd{margin:0;overflow-wrap:anywhere;white-space:pre-line}.detail-meta dt{color:var(--muted)}.detail-links{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12px;margin-top:12px}.badge{display:inline-block;font-size:11px;border-bottom:1px solid #a4b6a9;color:#496251;padding-bottom:3px;margin-bottom:10px}.section{margin-top:30px;border-top:1px solid var(--line);padding-top:24px}.section:first-child{margin-top:0;border-top:0;padding-top:0}.table-scroll{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:4px}table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px;line-height:1.7}th{text-align:left;background:#f0f4f1;color:#42594b;font-weight:600;padding:11px 13px;vertical-align:top;border-bottom:1px solid #bdcfc2}td{padding:12px 13px;border-bottom:1px solid #e3e9e5;vertical-align:top;overflow-wrap:anywhere}td p:last-child{margin-bottom:0}td small{display:block;color:var(--muted);margin-top:6px}tbody tr:last-child td{border:0}tbody tr:hover{background:#f5f9f6}.finding{border-top:1px solid var(--line);padding:20px 0;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px}.finding:first-child{border-top:0;padding-top:0}.finding-label{font-size:12px;color:var(--muted);margin-bottom:8px}.dependency-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:#fff}.dependency-item{padding:14px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px;line-height:1.7;min-width:0;overflow-wrap:anywhere}.dependency-item.integrated{border-top:3px solid #529f7c}.dependency-item.blocked{border-top:3px solid #ca8a5a}.dependency-item.ready{border-top:3px solid #4d8bc0}.dependency-item h3{font-size:13px}.dependency-item ul{margin:6px 0 12px;padding-left:18px}.state{font-size:12px;margin-bottom:10px;color:#55665b}.sources{display:grid;gap:12px;font-size:13px}.footer{font-size:12px;color:var(--muted);padding-top:20px;border-top:1px solid var(--line);margin-top:32px;line-height:1.8}.layout-caption{font-size:12px;color:#66796a;margin-top:12px;line-height:1.8}.warnings{margin:0;padding-left:18px}.shots{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px}.shot{margin:0;width:220px;max-width:100%}.shot a{display:block;border:1px solid var(--line);background:#edf1ee;height:220px;border-radius:4px}.shot img{width:100%;height:100%;object-fit:contain}.shot figcaption{font-size:12px;line-height:1.6;margin-top:8px;overflow-wrap:anywhere}

@media(max-width:640px){.top{padding:18px 16px 0}main{padding:20px 16px 32px}.topline{display:block}h1{font-size:22px}.stamp{text-align:left;margin-top:8px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:20px 12px;margin:20px 0}.metric{min-width:0;padding-right:8px;border:0}.metric .value{font-size:22px}.tabs{gap:20px}.tabs button{font-size:13px}.finding{grid-template-columns:1fr;gap:8px}.toolbar{gap:8px}.toolbar label{flex-wrap:wrap}.searchbox{width:100%}.summary-line{padding:10px 12px}.dependency-list{grid-template-columns:1fr}}

<body>
<header class="top">
  <div class="topline"><div><div class="project" id="project"></div><h1 id="title"></h1></div><div class="stamp muted" id="stamp"></div></div>
  <div class="metrics" id="metrics"></div>
  <nav class="tabs" role="tablist" aria-label="报告视图">
    <button role="tab" id="tab-timeline" aria-selected="true" aria-controls="timeline-panel" data-view="timeline">完成与时序</button>
    <button role="tab" id="tab-causes" aria-selected="false" aria-controls="causes-panel" data-view="causes" tabindex="-1">因果与规则</button>
    <button role="tab" id="tab-tests" aria-selected="false" aria-controls="tests-panel" data-view="tests" tabindex="-1">测试记录</button>
    <button role="tab" id="tab-evidence" aria-selected="false" aria-controls="evidence-panel" data-view="evidence" tabindex="-1">证据与资源</button>
  </nav>
</header>
<main>
<section class="panel" id="timeline-panel" role="tabpanel" aria-labelledby="tab-timeline">
  <div class="summary-line" id="task-summary"></div>
  <div class="toolbar">
    <label>起点 UTC<input id="from" type="datetime-local" step="0.001"></label><label>终点 UTC<input id="to" type="datetime-local" step="0.001"></label>
    <label>缩放<input id="zoom" type="range" min="1" max="6" step="0.5" value="1"><output id="zoom-value">1×</output></label>
    <label>泳道<select id="lane-filter"><option value="all">全部</option></select></label>
    <div class="searchbox"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21 21-4.34-4.34"></path><circle cx="11" cy="11" r="8"></circle></svg><input id="search" type="search" aria-label="搜索事件" placeholder="搜索事件、执行者或版本"></div>
    <button class="icon-button" id="reset" aria-label="重置筛选" title="重置筛选"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg></button>
  </div>
  <div class="legend" id="legend"></div>
  <div class="layout"><div><div class="timeline-frame"><div class="timeline-scroll" id="timeline-scroll"><div class="timeline" id="timeline"></div></div></div><div class="layout-caption" id="coverage-note"></div></div><aside id="detail" aria-live="polite"></aside></div>
  <div class="section"><h2>完成、待完成与依赖</h2><div class="dependency-list" id="dependencies"></div></div>
</section>
<section class="panel" id="causes-panel" hidden role="tabpanel" aria-labelledby="tab-causes"><div id="findings"></div><div class="section" id="rules-section"><h2>规则、实际执行与建议</h2><div class="table-scroll"><table><thead><tr><th>规则与原文</th><th>实际执行与机制</th><th>修改建议与保留约束</th><th>置信度与证据</th></tr></thead><tbody id="rules"></tbody></table></div></div></section>
<section class="panel" id="tests-panel" hidden role="tabpanel" aria-labelledby="tab-tests"><div class="table-scroll"><table><thead><tr><th>测试与时刻 UTC</th><th>方法与结果</th><th>原因</th><th>修复与证据</th></tr></thead><tbody id="tests"></tbody></table></div></section>
<section class="panel" id="evidence-panel" hidden role="tabpanel" aria-labelledby="tab-evidence">
  <div class="toolbar"><h2 style="margin:0">证据索引</h2><button class="icon-button" id="download" title="下载报告数据" aria-label="下载报告数据"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3"></path><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><path d="m7 10 5 5 5-5"></path></svg></button></div>
  <div class="sources" id="sources"></div><div class="shots" id="shots"></div>
  <div class="section" id="resources-section"><h2>资源归属与处置</h2><div class="table-scroll"><table><thead><tr><th>资源</th><th>所有者</th><th>用途</th><th>处置</th></tr></thead><tbody id="resources"></tbody></table></div></div>
  <div class="section" id="warnings-section"><h2>记录限制</h2><ul class="warnings" id="warnings"></ul></div>
</section>
<footer class="footer" id="footer"></footer>
</main>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id);
const taskLabels={'in-progress':'进行中',completed:'已完成',partial:'部分完成',blocked:'受阻',paused:'已暂停'};
const ticketLabels={integrated:'已集成','in-progress':'进行中',ready:'可开始',blocked:'受阻','not-started':'未开始'};
const outcomeLabels={passed:'通过',failed:'失败','expected-red':'预期红测',skipped:'跳过',unknown:'未知'};
const confidenceLabels={verified:'已核实',inferred:'推断',unknown:'未知'};
const kindLabels={phase:'阶段',command:'命令',wait:'明确等待',point:'时间点'};
const categoryLabels={implementation:'实施',review:'审查',validation:'验证',diagnosis:'诊断',integration:'集成',coordination:'协调'};
const colors={implementation:'#6c9980',review:'#9975b7',validation:'#3b9673',diagnosis:'#b38457',integration:'#5e95c6',coordination:'#67969d'};
function node(tag,content,className){const el=document.createElement(tag);if(content!=null)el.textContent=String(content);if(className)el.className=className;return el;}
function add(parent,...children){for(const child of children)if(child)parent.append(child);return parent;}
function fmt(value){return new Date(value).toISOString().replace('T',' ').replace(/\.\d{3}Z$/,' UTC');}
function span(ms){const seconds=Math.max(0,ms)/1000;if(seconds<60)return `${Number(seconds.toFixed(3))}秒`;const mins=Math.floor(seconds/60),secs=Math.floor(seconds%60);return mins<60?`${mins}分${secs}秒`:`${Math.floor(mins/60)}小时${mins%60}分${secs}秒`;}
function safeHref(href){if(typeof href!=='string'||/[\u0000-\u001f\u007f]/.test(href)||/^(?:\/\/|\\\\)/.test(href))return false;const match=href.match(/^([^/?#]*):/);return !match||['http','https','mailto'].includes(match[1].toLowerCase());}
function link(href,label){if(!safeHref(href))return node('span',`${label}（链接不可用）`,'muted');const a=node('a',label);a.setAttribute('href',href);if(/^https?:/i.test(href)){a.target='_blank';a.rel='noopener noreferrer';}return a;}
function links(items,parent){const wrap=node('div',null,'detail-links');for(const item of items??[])wrap.append(link(item.href,item.label));if(wrap.children.length)parent.append(wrap);}
function paragraph(parent,label,value){if(value){const p=node('p');add(p,node('strong',`${label}：`),document.createTextNode(value));parent.append(p);}}
function metric(value,label){const el=node('div',null,'metric');add(el,node('div',value,'value'),node('div',label,'name'));$('metrics').append(el);}
$('project').textContent=data.project;$('title').textContent=data.title;
$('stamp').textContent=`快照 ${fmt(data.snapshotAt)}\n任务状态：${taskLabels[data.task.status]}`;
metric(taskLabels[data.task.status],'任务元数据状态');metric(`${data.tickets.filter(t=>t.status==='integrated').length} / ${data.tickets.length}`,'已集成 / 记录票数');
metric(span(data.metrics.cumulativeMs),'有结束记录的命令 · 累计');metric(span(data.metrics.unionMs),'命令区间 · 并行去重');
$('task-summary').textContent=`${data.task.goal||'目标未记录'}\n${data.task.status==='completed'?'完成状态来自任务元数据。':'任务尚未全部完成。'}局部测试通过不会自动改变交付状态。`;
$('coverage-note').textContent=`${data.metrics.count} 个有结束记录的命令；重叠区间累计 ${span(data.metrics.overlapMs)}。命令时间包含其记录边界内的活动，不代表 CPU 时间。未记录空档不推断为等待；无结束记录只显示时间点。`;
$('footer').textContent=`时间采用 UTC。范围：${data.scope.platform}${data.scope.mobile?'；包含移动端范围':'；未包含移动端产品范围'}。统计只纳入 kind=command 且有结束时间的记录；阶段、明确等待、时间点和未知空档不计入命令时长。图标：Lucide（ISC），https://lucide.dev。`;
const tabs=[...document.querySelectorAll('[role=tab]')];
if(!data.tests.length)$('tab-tests').hidden=true;
if(!data.findings.length&&!data.rules.length)$('tab-causes').hidden=true;
function view(name){for(const tab of tabs){const selected=tab.dataset.view===name;tab.setAttribute('aria-selected',String(selected));tab.tabIndex=selected?0:-1;$(tab.getAttribute('aria-controls')).hidden=!selected;}}
for(const tab of tabs){tab.onclick=()=>view(tab.dataset.view);tab.onkeydown=event=>{const visible=tabs.filter(t=>!t.hidden),i=visible.indexOf(tab);let next;if(event.key==='ArrowRight')next=visible[(i+1)%visible.length];if(event.key==='ArrowLeft')next=visible[(i-1+visible.length)%visible.length];if(event.key==='Home')next=visible[0];if(event.key==='End')next=visible.at(-1);if(next){event.preventDefault();view(next.dataset.view);next.focus();}};}
const eventTimes=data.events.flatMap(e=>[Date.parse(e.start),...(e.end&&e.kind!=='point'?[Date.parse(e.end)]:[])]);
const fullStart=Math.min(Date.parse(data.task.startedAt),...eventTimes);
const fullEnd=Math.max(Date.parse(data.task.endedAt||data.snapshotAt),...eventTimes,fullStart+1000);
const dateInput=ms=>new Date(ms).toISOString().slice(0,-1);
const lanes=[...new Set(data.events.map(event=>event.lane))];
for(const lane of lanes){const option=node('option',lane);option.value=lane;$('lane-filter').append(option);}
const enabled=new Set(Object.keys(categoryLabels));
for(const [category,label]of Object.entries(categoryLabels)){const wrapper=node('label');const checkbox=node('input');checkbox.type='checkbox';checkbox.checked=true;checkbox.setAttribute('aria-label',label);const dot=node('span',null,'dot');dot.style.background=colors[category];add(wrapper,checkbox,dot,document.createTextNode(label));checkbox.onchange=()=>{checkbox.checked?enabled.add(category):enabled.delete(category);renderTimeline();};$('legend').append(wrapper);}
let selectedId=null;
function showDetail(event){const detail=$('detail');detail.replaceChildren();if(!event){add(detail,node('h3','事件详情'),node('p','尚未选择事件。','muted'));return;}add(detail,node('div',`${kindLabels[event.kind]} · ${outcomeLabels[event.outcome]}`,'badge'),node('h3',event.label,'detail-title'));const meta=node('dl',null,'detail-meta');const rows=[['泳道',event.lane],['类别',categoryLabels[event.category]],['开始',fmt(event.start)],['结束',event.end&&event.kind!=='point'?fmt(event.end):'未记录区间结束'],['时长',event.end&&event.kind!=='point'?span(Date.parse(event.end)-Date.parse(event.start)):'不计区间耗时'],['置信度',confidenceLabels[event.confidence]],['执行者',event.actor],['版本',event.revision]];for(const[label,value]of rows)if(value)add(meta,node('dt',label),node('dd',value));detail.append(meta);paragraph(detail,'记录',event.detail);paragraph(detail,'原因',event.reason);links(event.evidence,detail);}
function reset(){ $('from').value=dateInput(fullStart);$('to').value=dateInput(fullEnd);$('zoom').value='1';$('zoom-value').textContent='1×';$('search').value='';$('lane-filter').value='all';enabled.clear();Object.keys(categoryLabels).forEach(c=>enabled.add(c));$('legend').querySelectorAll('input').forEach(c=>c.checked=true);renderTimeline();}
function renderTimeline(){const target=$('timeline');target.replaceChildren();const begin=Date.parse($('from').value+'Z'),end=Date.parse($('to').value+'Z');if(!Number.isFinite(begin)||!Number.isFinite(end)||end<=begin){target.append(node('div','时间窗口无效：终点须晚于起点。','empty'));return;}
 const width=Math.max(760,$('timeline-scroll').clientWidth)*Number($('zoom').value);target.style.width=`${width}px`;const usable=width-150,scale=usable/(end-begin),search=$('search').value.trim().toLowerCase(),laneFilter=$('lane-filter').value;
 const filtered=data.events.filter(event=>enabled.has(event.category)&&(laneFilter==='all'||event.lane===laneFilter)&&[event.label,event.detail,event.reason,event.lane,event.actor,event.revision].join(' ').toLowerCase().includes(search)&&Date.parse(event.start)<=end&&Date.parse(event.end&&event.kind!=='point'?event.end:event.start)>=begin);
 if(!filtered.length){target.append(node('div','没有事件匹配当前筛选。','empty'));return;}
 const axis=node('div',null,'axis');axis.append(node('div','泳道 / UTC','axis-label'));const tickCount=Math.max(2,Math.floor(usable/145));for(let i=0;i<=tickCount;i++){const at=begin+(end-begin)*i/tickCount;const tick=node('div',null,'axis-time');tick.style.left=`${150+usable*i/tickCount}px`;if(i===tickCount)tick.style.transform='translateX(-100%)';const date=new Date(at);add(tick,document.createTextNode(date.toISOString().slice(11,19)),node('span',date.toISOString().slice(0,10),'axis-day'));axis.append(tick);}target.append(axis);
 for(const lane of lanes){const rows=filtered.filter(event=>event.lane===lane).sort((a,b)=>Date.parse(a.start)-Date.parse(b.start));if(!rows.length)continue;const tracks=[],placements=[];for(const event of rows){const left=Math.max(0,(Date.parse(event.start)-begin)*scale),right=Math.min(usable,(Date.parse(event.end&&event.kind!=='point'?event.end:event.start)-begin)*scale);const eventWidth=Math.min(usable-left,Math.max(10,right-left));let track=tracks.findIndex(edge=>edge+4<=left);if(track<0)track=tracks.length;tracks[track]=left+eventWidth;placements.push({event,left,width:eventWidth,track});}
 const laneNode=node('div',null,'lane');laneNode.style.height=`${Math.max(60,tracks.length*34+20)}px`;laneNode.append(node('div',lane,'lane-title'));const area=node('div',null,'lane-events');for(let i=0;i<=tickCount;i++){const grid=node('div',null,'gridline');grid.style.left=`${usable*i/tickCount}px`;area.append(grid);}for(const{event,left,width,track}of placements){const button=node('button',event.kind==='point'||!event.end?'':event.label,'event');button.dataset.id=event.id;button.dataset.kind=event.kind;button.dataset.category=event.category;button.dataset.outcome=event.outcome;button.style.left=`${Math.min(left,usable-10)}px`;button.style.width=`${Math.max(10,width)}px`;button.style.top=`${10+track*34}px`;if(!event.end)button.classList.add('open');if(event.id===selectedId)button.classList.add('selected');button.title=`${event.label}\n${fmt(event.start)}${event.end?' → '+fmt(event.end):' · 结束未记录'}`;button.setAttribute('aria-label',`${event.label}，${kindLabels[event.kind]}，${outcomeLabels[event.outcome]}`);button.onclick=()=>{selectedId=event.id;target.querySelectorAll('.event').forEach(b=>b.classList.toggle('selected',b.dataset.id===selectedId));showDetail(event);};area.append(button);}laneNode.append(area);target.append(laneNode);}
}
for(const id of['from','to','lane-filter'])$(id).onchange=renderTimeline;$('search').oninput=renderTimeline;$('zoom').oninput=()=>{$('zoom-value').textContent=$('zoom').value+'×';renderTimeline();};$('reset').onclick=reset;
for(const ticket of data.tickets){const item=node('div',null,`dependency-item ${ticket.status}`);const title=node('h3');title.append(ticket.url?link(ticket.url,`${ticket.id} ${ticket.title}`):document.createTextNode(`${ticket.id} ${ticket.title}`));add(item,title,node('div',ticketLabels[ticket.status],'state'));paragraph(item,'依赖',ticket.blockers.length?ticket.blockers.join('、'):'无已记录阻塞依赖');for(const[key,label]of[['delivered','已完成'],['pending','待完成']])if(ticket[key].length){item.append(node('strong',label));const ul=node('ul');ticket[key].forEach(value=>ul.append(node('li',value)));item.append(ul);}$('dependencies').append(item);}if(!data.tickets.length)$('dependencies').append(node('div','未提供票据；任务状态以元数据为准。','empty'));
for(const finding of data.findings){const row=node('article',null,'finding'),left=node('div'),right=node('div');add(left,node('div',`${finding.id} · ${confidenceLabels[finding.confidence]}`,'finding-label'),node('h3',finding.title));paragraph(right,'机制',finding.mechanism);paragraph(right,'影响',finding.impact);paragraph(right,'建议',finding.proposal);links(finding.evidence,right);add(row,left,right);$('findings').append(row);}
$('rules-section').hidden=!data.rules.length;
for(const rule of data.rules){const row=node('tr'),source=node('td'),actual=node('td'),proposal=node('td'),proof=node('td');add(source,node('strong',`${rule.id} ${rule.title}`));if(rule.source)source.append(link(rule.source,'规则来源'));paragraph(source,'原文',rule.quote);paragraph(actual,'实际',rule.actual);paragraph(actual,'机制',rule.mechanism);paragraph(proposal,'建议',rule.proposal);paragraph(proposal,'保留',rule.retain);add(proof,node('p',`${confidenceLabels[rule.confidence]}${rule.classification?' · '+rule.classification:''}`));links(rule.evidence,proof);add(row,source,actual,proposal,proof);$('rules').append(row);}
for(const test of data.tests){const row=node('tr'),identity=node('td'),result=node('td'),cause=node('td'),fix=node('td');identity.append(node('strong',test.label));if(test.start)identity.append(node('small',fmt(test.start)));if(test.end)identity.append(node('small',fmt(test.end)));if(test.start&&test.end)identity.append(node('small',span(Date.parse(test.end)-Date.parse(test.start))));add(result,node('strong',outcomeLabels[test.outcome]),node('p',test.method));if(typeof test.uiExecuted==='boolean')result.append(node('small',test.uiExecuted?'实际执行 UI':'未执行 UI'));cause.append(node('p',test.cause));fix.append(node('p',test.fix));links(test.evidence,fix);add(row,identity,result,cause,fix);$('tests').append(row);}
const proofs=[...data.events,...data.findings,...data.rules,...data.tests].flatMap(row=>row.evidence||[]);for(const ticket of data.tickets)if(ticket.url)proofs.push({href:ticket.url,label:`${ticket.id} ${ticket.title}`});for(const rule of data.rules)if(rule.source)proofs.push({href:rule.source,label:`${rule.id} 规则来源`});const seen=new Set();for(const proof of proofs){const key=proof.href||proof.label;if(seen.has(key))continue;seen.add(key);$('sources').append(link(proof.href,proof.label));if(proof.href&&/^\.\.?\//.test(proof.href)&&/\.(png|jpe?g|webp|gif)(?:[?#]|$)/i.test(proof.href)){const figure=node('figure',null,'shot'),a=link(proof.href,''),image=node('img');image.src=proof.href;image.alt=proof.label;image.loading='lazy';a.append(image);add(figure,a,node('figcaption',proof.label));$('shots').append(figure);}}if(!proofs.length)$('sources').append(node('p','未提供证据链接。','muted'));
$('resources-section').hidden=!data.resources.length;for(const resource of data.resources){const row=node('tr');for(const value of[resource.name,resource.owner,resource.purpose,{cleaned:'已清理',retained:'保留',unknown:'未知'}[resource.disposition]])row.append(node('td',value));$('resources').append(row);}
$('warnings-section').hidden=!data.warnings.length;data.warnings.forEach(warning=>$('warnings').append(node('li',warning)));
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=node('a');a.href=url;a.download='development-timeline.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
let lastWidth=0;new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width!==lastWidth){lastWidth=width;renderTimeline();}}).observe($('timeline-scroll'));
showDetail();reset();
</script>
</body>
