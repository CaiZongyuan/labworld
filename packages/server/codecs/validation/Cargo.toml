[package]
name = "lab-word-validation-codec"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
draco-core = { version = "=2.2.1", default-features = false, features = ["decoder", "point_cloud_decode", "edgebreaker_valence_decode", "legacy_bitstream_decode"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
gltf = { version = "=1.4.1", default-features = false, features = ["extensions", "utils"] }
serde_json = "=1.0.151"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
codegen-units = 1
