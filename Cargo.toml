[workspace]
members = ["apps/api", "apps/worker", "crates/app", "crates/platform"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false

[workspace.dependencies]
axum = { version = "0.8.8", features = ["json"] }
http-body-util = "0.1.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync", "process", "fs", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }

tracing = "0.1.44"
tracing-core = "0.1.36"
opentelemetry = { version = "=0.33.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "=0.33.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry-otlp = { version = "=0.33.0", default-features = false, features = ["trace", "metrics", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "=0.34.0", default-features = false }
tracing-appender = "=0.2.5"
opentelemetry-proto = { version = "=0.33.0", default-features = false, features = ["gen-tonic-messages", "trace", "metrics"] }
prost = "=0.14.4"
uuid = { version = "1.21.0", features = ["v7"] }

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros", "chrono", "json"] }

utoipa = { version = "5.4.0", features = ["axum_extras", "chrono"] }

tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
thiserror = "2.0.18"
argon2 = { version = "0.5.3", features = ["std"] }
sha2 = "0.10.9"
hmac = "0.12.1"
hex = "0.4.3"
email_address = { version = "0.2.9", default-features = false }
url = "2.5.8"
futures-util = "0.3.32"
chrono = { version = "0.4.44", default-features = false, features = ["serde"] }
base64 = "0.22.1"
async-trait = "0.1.89"
aws-sdk-s3 = { version = "=1.149.0", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
lettre = { version = "=0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls", "ring", "webpki-roots"] }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
redis = { version = "=1.7.1", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls", "json"] }
percent-encoding = "2.3.2"
mime = "0.3.17"
zip = { version = "=8.6.0", default-features = false }
tempfile = "=3.27.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
pulldown-cmark-to-cmark = "=22.0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
