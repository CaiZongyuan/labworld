<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab Word - Visual Onboarding Preview v2</title>
    <script>
      try {
        if (!localStorage.getItem('labos-threejs.locale'))
          localStorage.setItem('labos-threejs.locale', 'zh');
        const theme = localStorage.getItem('labos-threejs.theme');
        document.documentElement.classList.toggle('dark', theme === 'dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
