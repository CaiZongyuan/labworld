name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-client-windows-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-source-client-diagnostic:
    name: Original Windows Source and completed-Task recovery diagnostics
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      SOURCE_CLIENT_DIAGNOSTIC_EXPECT_SELECTED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Safe actual environment receipt
        run: node scripts/source-client-diagnostic-environment.mjs
      - name: Run only the unchanged original normal Python source case
        run: >-
          node --test
          --test-name-pattern='^the normal Python source entrypoint reports presence without sampling a GPU and releases only its connection$'
          --test-reporter=./tests/support/source-client-safe-reporter.mjs
          --experimental-strip-types
          tests/server/source-client.test.ts
      - name: Keep only safe diagnostic facts and owned ledgers
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: source-client-windows-diagnostic
          path: |
            .scratch/source-client-windows/*.json
            .scratch/vnext-m1/**/source-client-diagnostic.json
            .scratch/vnext-m1/**/owned-resources.json
            .scratch/vnext-m1/**/source-client-resources.json
          if-no-files-found: error
          retention-days: 7
      - name: Confirm the original completed-Task selector without running a case
        if: always()
        run: node scripts/windows-completed-task-diagnostic.mjs --discover
      - name: Original Windows completed-Task kill and recovery diagnostic
        if: always()
        run: node scripts/windows-completed-task-diagnostic.mjs
      - name: Keep separate closed Recording diagnostic facts and fixture ledger
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-completed-task-diagnostic
          path: |
            .scratch/windows-completed-task-diagnostic/**/summary.json
            .scratch/windows-completed-task-diagnostic/**/test-summary.json
            .scratch/windows-completed-task-diagnostic/**/owned-resources.json
          if-no-files-found: error
          retention-days: 7
