# Temporary diagnostic branch only; do not merge this workflow into delivery.
name: CI static Canvas diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: static-canvas-diagnosis-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-static-witness:
    name: Original static World-readiness witness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      E2E_LAB_REFERENCE_LOAD: '1'
      DIAGNOSTIC_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Same Chromium runtime as the retained CI
        run: pnpm exec playwright install --with-deps chromium
      - name: Same pinned Python Publisher environment
        id: environment
        run: |
          python3.12 -m venv .scratch/motion-python
          .scratch/motion-python/bin/python -m pip install -r tools/synthetic-motion/requirements.txt
          node --input-type=module - <<'JS'
          import { mkdirSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { cpus, release, arch } from 'node:os';
          import { chromium } from '@playwright/test';
          mkdirSync('.scratch/renderer-hosted', { recursive: true });
          writeFileSync('.scratch/renderer-hosted/environment.json', JSON.stringify({
            candidate: process.env.DIAGNOSTIC_HEAD,
            node: process.version,
            pnpm: execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim(),
            python: execFileSync('.scratch/motion-python/bin/python', ['--version'], { encoding: 'utf8' }).trim(),
            chromium: execFileSync(chromium.executablePath(), ['--version'], { encoding: 'utf8' }).trim(),
            kernel: release(), arch: arch(), cpus: cpus().length,
            referenceLoad: process.env.E2E_LAB_REFERENCE_LOAD,
            coverage: ['original static World-readiness regression'],
          }, null, 2));
          JS
      - name: Original static World-readiness regression
        if: ${{ !cancelled() && steps.environment.outcome == 'success' }}
        run: pnpm test:e2e tests/e2e/lab-render-metric-readiness.spec.ts
      - name: Retain only owned safe diagnostics and cleanup facts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: original-static-canvas-readiness-evidence
          path: |
            .scratch/renderer-hosted/*.json
            .scratch/vnext-m1/**/*.json
            .scratch/vnext-m1/**/*.jsonl
            .scratch/vnext-m1/**/*.png
            test-results/summary.json
          if-no-files-found: error
          retention-days: 7
