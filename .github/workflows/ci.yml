name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: diagnostic-74-dialog-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-browser-shard:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2E_LAB_REFERENCE_LOAD: '1'
      DIALOG_DIAGNOSTIC: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Install the original pinned synthetic Publisher
        run: |
          python3.12 -m venv .scratch/motion-python
          .scratch/motion-python/bin/python -m pip install -r tools/synthetic-motion/requirements.txt
      - name: Original shard 2 with passive bounded diagnostics
        run: pnpm test:e2e --profile-shard=2/2
      - name: Keep safe evidence and owned cleanup receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostic-74-dialog-shard2
          path: |
            .scratch/vnext-m1/
            test-results/summary.json
            test-results/lab-foundation/*.png
          if-no-files-found: ignore
          retention-days: 7
