# Isolated Windows diagnostic only; never merge this workflow.
name: CI Windows pause-control diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-pause-control-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-pause-control:
    name: Original legacy and reliability prefix through target with first failure facts
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      WINDOWS_PAUSE_DIAGNOSTIC: '1'
      DIAGNOSTIC_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Record only safe environment facts
        run: |
          node --input-type=module -e "import {mkdirSync,writeFileSync} from 'node:fs'; import {cpus,release} from 'node:os'; mkdirSync('.scratch/windows-pause-diagnostic',{recursive:true}); writeFileSync('.scratch/windows-pause-diagnostic/environment.json',JSON.stringify({candidate:process.env.DIAGNOSTIC_HEAD,platform:process.platform,node:process.version,arch:process.arch,cpus:cpus().length,kernel:release(),image:process.env.ImageVersion??null,docker:'not-used'},null,2));"
      - name: Run all original legacy cases then reliability prefix through original target
        run: >-
          node --test --test-concurrency=1 --experimental-strip-types
          --test-reporter=./tests/support/windows-pause-safe-reporter.mjs
          --test-name-pattern='^(?:recording genuine schema\-v3 ended Session adopts exact snapshot and dependency custody without replay across two reopens|recording legacy adoption quota preserves original Session pins and bytes and refuses new admission until honest retry|recording timestamp oracle preserves six digits and distinguishes UTC offset year boundaries|recording active Command capture reports the whole HTTP SQL operation and exact accepted fact without changing no\-Recording budgets|recording retained reads enforce identities, Lab binding and delete CSRF while preserving bytes|recording sparse trusted reports preserve independent microsecond watermarks and omit rejected facts|recording relative clock backward step preserves paused source, durable ACK and renewed ticket|recording relative clock forward step preserves paused source, durable ACK and renewed ticket|recording selected bytes survive sparse live delivery and exact duplicate ACK|recording ACK\-only network loss retries exact uncertain packet without duplicate append|recording boundary rejects changed pose with identical sequence/time A=1000|recording boundary rejects changed pose with identical sequence/time A=3000|recording write failure preserves external durable bytes and interrupts without further ACK|recording pending command baseline preserves original input and idempotent acceptance|recording actual SIGKILL after prepared recovers only witnessed command events with exact timestamps|recording actual SIGKILL after committed recovers only witnessed command events with exact timestamps|recording shared resource deletion releases only its owner and deletion tombstone survives reopen|recording acknowledged bytes survive actual stopped\-directory backup and new\-directory restore|recording completed Task survives actual kill before marker while physics stays paused at A=1000|recording successor readiness write failure leaves no active unrecorded Reset Session|recording Reset capture handoff accounts for a concurrent ordinary Command exactly once|recording managed publication survives revocation of the initiating Agent credential|recording oracle matches literal high\-epoch packet and rejects altered ACK/content|recording Reset post\-commit marker failure compensates successor without restart or Lab blockage|recording actual Core publication failure retains ACKed candidate identity and bytes through retry and second reopen|recording actual native write completion hold bounds ordinary caller during idle Pause and retains owned writer|recording actual native sync completion hold bounds ordinary caller during idle Pause and retains owned writer|recording actual native sync completion waits for public reads while committed interruption sync remains owned)$'
          tests/e2e/recording-legacy.test.ts tests/e2e/recording-reliability.test.ts
      - name: Check exact selection and all archived owned fixture cleanup
        if: always()
        run: |
          node --experimental-strip-types --input-type=module -e "import {existsSync,readFileSync,readdirSync,writeFileSync,mkdirSync} from 'node:fs'; import {join} from 'node:path'; import {processIdentity,sameProcess,recoverServerResources} from './tests/support/server-resources.ts'; const output='.scratch/windows-pause-diagnostic'; mkdirSync(output,{recursive:true}); const evidence='.scratch/vnext-m1'; const names=existsSync(evidence)?readdirSync(evidence).filter(name=>/^lab-word-m1-[0-9A-Za-z]+$/.test(name)):[]; const checks=[]; const groups=new Map(); for(const name of names){const path=join(evidence,name,'owned-resources.json'); if(!existsSync(path))continue; let row=JSON.parse(readFileSync(path,'utf8')); if(row.state!=='cleaned')row=await recoverServerResources(path); const creator=await processIdentity(row.creator.pid); const key=JSON.stringify([row.creator.pid,row.creator.executable,row.creator.start]); const group=groups.get(key)??{started:row.creator.start,count:0}; group.count++; groups.set(key,group); checks.push({fixture:name,owner:row.owner,state:row.state,directoryCleared:row.directory==='',processes:row.processes.length,inProcessConsumers:row.inProcessConsumers?.length??0,launchIntent:!!row.launchIntent,docker:row.docker.length,creatorStopped:!creator||!sameProcess(creator,row.creator)});} const summaryPath=join(output,'test-summary.json'); const summary=existsSync(summaryPath)?JSON.parse(readFileSync(summaryPath,'utf8')):null; const creatorGroupCounts=[...groups.values()].sort((a,b)=>a.started.localeCompare(b.started)).map(row=>row.count); const ownershipExpectationComplete=checks.length===28&&creatorGroupCounts.length===2&&creatorGroupCounts[0]===3&&creatorGroupCounts[1]===25; const resourcesClosed=checks.length===names.length&&checks.every(row=>row.state==='cleaned'&&row.directoryCleared&&row.processes===0&&row.inProcessConsumers===0&&!row.launchIntent&&row.docker===0&&row.creatorStopped); const receipt={candidate:process.env.DIAGNOSTIC_HEAD,exactPrefix:summary?.exactPrefix===true,allPassed:summary?.allPassed===true,earliestFailure:summary?.earliestFailure??null,targetExactOne:summary?.targetExactOne===true,targetOutcome:summary?.targetOutcome??'unknown',originalVerdict:summary?.verdict??'unknown',resourcesClosed,ownershipExpectationComplete,creatorGroupCounts,checks,globalPostVmInventory:'unavailable; no owned Docker resources'}; writeFileSync(join(output,'closed-receipt.json'),JSON.stringify(receipt,null,2)); if(!receipt.exactPrefix||!receipt.targetExactOne||!resourcesClosed||!ownershipExpectationComplete)process.exitCode=1;"
      - name: Retain only safe original verdict, public failure facts and owned ledger
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-task-receipt-safe-evidence
          path: |
            .scratch/windows-pause-diagnostic/environment.json
            .scratch/windows-pause-diagnostic/test-summary.json
            .scratch/windows-pause-diagnostic/closed-receipt.json
            .scratch/vnext-m1/lab-word-m1-*/windows-pause-failure.json
            .scratch/vnext-m1/lab-word-m1-*/windows-public-failure.json
            .scratch/vnext-m1/lab-word-m1-*/owned-resources.json
          if-no-files-found: error
          retention-days: 7
