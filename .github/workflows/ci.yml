# Diagnostic branch only: reuse the registered CI workflow for explicit dispatch.
name: Diagnose Windows U64 Recording receipt
on:
  workflow_dispatch:
    inputs:
      collection:
        description: Reproduction collection (a focused pass is not proof of a fixed bug)
        type: choice
        default: file
        options: [focused, file]
permissions:
  contents: read
jobs:
  windows-u64:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Original persisted epoch and expiry fixture, original 60s verdict
        if: inputs.collection == 'focused'
        run: node --test --test-concurrency=1 --experimental-strip-types --test-name-pattern="persisted unsigned epoch above 2\^53" tests/server/session-authority.test.ts
      - name: Original whole-file collection, unchanged per-case verdicts
        if: inputs.collection == 'file'
        run: node --test --test-concurrency=1 --experimental-strip-types tests/server/session-authority.test.ts
      - name: Keep finite trace and actual owner receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-u64-diagnostic
          path: |
            .scratch/vnext-m1/**/owned-resources.json
            .scratch/vnext-m1/**/recording-u64-diagnostic.json
            .scratch/vnext-m1/**/recording-u64-server-phases.json
          retention-days: 7
          if-no-files-found: ignore
