# Temporary diagnostic ref only; never merge this workflow into delivery.
name: PR65 original workbench native trace
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr65-workbench-native-trace-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-workbench-trace:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Same pinned Chromium as full CI
        run: pnpm exec playwright install --with-deps chromium
      - name: Read-only host and resource inventory
        run: |
          mkdir -p .scratch/workbench-native-trace
          cat > .scratch/workbench-native-trace/inventory.mjs <<'JS'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { cpus } from 'node:os';
          import { chromium } from '@playwright/test';
          const query = (command, args) => execFileSync(command, args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'ignore'] }).trim();
          const count = (args) => { const value = query('docker', args); return value ? value.split('\n').length : 0; };
          let docker = { available: false };
          try {
            docker = {
              available: true,
              containers: count(['ps', '-aq']),
              volumes: count(['volume', 'ls', '-q']),
              networks: count(['network', 'ls', '-q']),
              disk: query('docker', ['system', 'df', '--format', '{{json .}}']).split('\n').filter(Boolean).map(JSON.parse).map(row => ({ type: row.Type, items: Number(row.TotalCount), active: Number(row.Active), size: row.Size })),
              mutationOperations: 0,
            };
          } catch { }
          writeFileSync('.scratch/workbench-native-trace/' + process.argv[2] + '-result.json', JSON.stringify({
            candidate: process.env.GITHUB_SHA,
            node: process.versions.node,
            pnpm: query('pnpm', ['--version']),
            chromium: query(chromium.executablePath(), ['--version']).match(/\d+\.\d+\.\d+\.\d+/)?.[0] ?? null,
            cpus: cpus().length,
            docker,
          }) + '\n', { mode: 0o600 });
          JS
          node .scratch/workbench-native-trace/inventory.mjs start
      - name: Discover exactly one original case
        run: pnpm exec playwright test tests/e2e/lab-workbench.spec.ts --grep 'the real spatial workbench gives the canvas' --list --reporter=list
      - name: Unchanged original workbench case with existing trace
        run: LAB_WORD_FRAME_TRACE=true E2E_LAB_REFERENCE_LOAD=1 pnpm test:e2e tests/e2e/lab-workbench.spec.ts --grep 'the real spatial workbench gives the canvas'
      - name: Read-only final resource inventory
        if: always()
        run: |
          if [ -f .scratch/workbench-native-trace/inventory.mjs ]; then
            node .scratch/workbench-native-trace/inventory.mjs end
          fi
      - name: Retain only projected trace, timing, summary and ownership facts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr65-workbench-native-trace-facts
          path: |
            .scratch/workbench-native-trace/*-result.json
            .scratch/vnext-m1/*/workbench-readiness-frame-trace.json
            .scratch/vnext-m1/*/observer-resource-timing.json
            .scratch/vnext-m1/*/owned-resources.json
            .scratch/vnext-m1/*/browser-owned-resources.json
            .scratch/vnext-m1/browser-suite-*/profile-*-summary.json
            .scratch/vnext-m1/browser-suite-*/profile-*-closure.json
            .scratch/vnext-m1/browser-suite-*/results.json
            test-results/summary.json
          if-no-files-found: error
          retention-days: 7
