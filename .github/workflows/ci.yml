# Diagnostic branch only: explicit dispatch runs exactly one retained Windows case.
name: Diagnose Windows Session recovery
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-recovery-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-recovery:
    runs-on: windows-2025
    timeout-minutes: 12
    env:
      LAB_WORD_WINDOWS_RECOVERY_DIAGNOSTIC: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Confirm exactly one original snapshot-pins case
        run: node scripts/windows-recovery-diagnostic.mjs --discover
      - name: Original Windows restart assertion with unchanged verdict and deadlines
        run: node scripts/windows-recovery-diagnostic.mjs
      - name: Keep only closed diagnostics and actual owner cleanup receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-recovery-diagnostic
          path: |
            .scratch/windows-recovery-diagnostic/**/summary.json
            .scratch/vnext-m1/**/owned-resources.json
          retention-days: 7
          if-no-files-found: error
