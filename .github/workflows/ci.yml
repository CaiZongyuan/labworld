name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCS_SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Complete Node, Web, tooling, budget and docs gate (no containers)
        run: pnpm check
      - name: Synthetic HTTP/SSE spike smoke (formal 30-minute evidence is separate)
        run: pnpm spike:server --duration-seconds 5
      - name: Final migration source coverage
        run: node scripts/migration-stage.mjs
      - name: Keep foundation evidence and cleanup receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m1-linux-evidence
          path: |
            .scratch/vnext-m1/
            .scratch/vnext-m0/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep verified documentation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
          retention-days: 7
      - name: Keep small gate facts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gate-facts-linux
          path: |
            .scratch/vnext-m0/suite-*.json
            .scratch/vnext-m0/coverage-*.json
            .scratch/vnext-m0/runs/**/owned-resources.json
            .scratch/vnext-m0/runs/**/results.json
            .scratch/vnext-m0/runs/**/target.json
            .scratch/vnext-m0/runs/**/config.json
            .scratch/vnext-m0/runs/**/target-process-proof.jsonl
            .scratch/vnext-m1/**/*.json
          if-no-files-found: ignore
          retention-days: 7
  web-journey-shards:
    name: web-journeys shard ${{ matrix.shard }}/2
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2]
    env:
      E2E_LAB_REFERENCE_LOAD: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium for actual Web/WebGL journeys
        run: pnpm exec playwright install --with-deps chromium
      - name: Install the pinned optional synthetic Publisher environment
        run: |
          python3.12 -m venv .scratch/motion-python
          .scratch/motion-python/bin/python -m pip install -r tools/synthetic-motion/requirements.txt
      - name: Owned retained desktop Web journeys and synthetic motion smoke
        run: pnpm test:e2e --profile-shard=${{ matrix.shard }}/2
      - name: Built production same-origin application journeys
        if: success() && matrix.shard == 1
        env:
          E2E_WEB_MODE: production
        run: pnpm test:e2e tests/e2e/lab-node-assets-world.spec.ts tests/e2e/spa-deep-links.spec.ts
      - name: Keep owned browser and service evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: web-journeys-evidence-${{ matrix.shard }}
          path: |
            .scratch/vnext-m1/
            test-results/summary.json
            test-results/lab-foundation/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep small browser and resource facts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gate-facts-web-journeys-${{ matrix.shard }}
          path: |
            .scratch/vnext-m1/**/*.json
            test-results/summary.json
          if-no-files-found: ignore
          retention-days: 7
  web-journeys:
    name: web-journeys
    if: always()
    needs: web-journey-shards
    runs-on: ubuntu-24.04
    steps:
      - name: Require every desktop browser shard to succeed
        env:
          SHARD_RESULT: ${{ needs.web-journey-shards.result }}
        run: test "$SHARD_RESULT" = success
  windows-foundation:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Actual startup, migration, HTTP, persistence and owned process proof
        run: pnpm test:server
      - run: pnpm contracts:check
      - run: pnpm spike:server --duration-seconds 5
      - name: Keep platform evidence and cleanup receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m1-windows-evidence
          path: |
            .scratch/vnext-m1/
            .scratch/vnext-m0/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep small gate facts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: gate-facts-windows
          path: |
            .scratch/vnext-m0/suite-*.json
            .scratch/vnext-m0/coverage-*.json
            .scratch/vnext-m0/runs/**/owned-resources.json
            .scratch/vnext-m0/runs/**/results.json
            .scratch/vnext-m0/runs/**/target.json
            .scratch/vnext-m0/runs/**/config.json
            .scratch/vnext-m0/runs/**/target-process-proof.jsonl
            .scratch/vnext-m1/**/*.json
          if-no-files-found: ignore
          retention-days: 7
  publish-docs:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
      - name: Publish artifact and verify matching Pages build
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-docs.mjs --request-build
