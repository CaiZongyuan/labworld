# Isolated Windows diagnostic only; never merge this workflow.
name: CI Windows pause-control diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-pause-control-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-pause-control:
    name: Original native-sync predecessor then exact target and public close facts
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      WINDOWS_PAUSE_DIAGNOSTIC: '1'
      DIAGNOSTIC_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Record only safe environment facts
        run: |
          node --input-type=module -e "import {mkdirSync,writeFileSync} from 'node:fs'; import {cpus,release} from 'node:os'; mkdirSync('.scratch/windows-pause-diagnostic',{recursive:true}); writeFileSync('.scratch/windows-pause-diagnostic/environment.json',JSON.stringify({candidate:process.env.DIAGNOSTIC_HEAD,platform:process.platform,node:process.version,arch:process.arch,cpus:cpus().length,kernel:release(),image:process.env.ImageVersion??null,docker:'not-used'},null,2));"
      - name: Run unchanged immediate native-sync predecessor then original target
        run: >-
          node --test --test-concurrency=1 --experimental-strip-types
          --test-reporter=./tests/support/windows-pause-safe-reporter.mjs
          --test-name-pattern='^recording actual native sync completion (?:hold bounds ordinary caller during idle Pause and retains owned writer|waits for public reads while committed interruption sync remains owned)$'
          tests/e2e/recording-reliability.test.ts
      - name: Check exact selection and all archived owned fixture cleanup
        if: always()
        run: |
          node --experimental-strip-types --input-type=module -e "import {existsSync,readFileSync,readdirSync,writeFileSync,mkdirSync} from 'node:fs'; import {join} from 'node:path'; import {processIdentity,sameProcess,recoverServerResources} from './tests/support/server-resources.ts'; const output='.scratch/windows-pause-diagnostic'; mkdirSync(output,{recursive:true}); const evidence='.scratch/vnext-m1'; const names=existsSync(evidence)?readdirSync(evidence).filter(name=>/^lab-word-m1-[0-9A-Za-z]+$/.test(name)):[]; const checks=[]; for(const name of names){const path=join(evidence,name,'owned-resources.json'); if(!existsSync(path))continue; let row=JSON.parse(readFileSync(path,'utf8')); if(row.state!=='cleaned')row=await recoverServerResources(path); const creator=await processIdentity(row.creator.pid); checks.push({fixture:name,owner:row.owner,state:row.state,directoryCleared:row.directory==='',processes:row.processes.length,inProcessConsumers:row.inProcessConsumers?.length??0,launchIntent:!!row.launchIntent,docker:row.docker.length,creatorStopped:!creator||!sameProcess(creator,row.creator)});} const summaryPath=join(output,'test-summary.json'); const summary=existsSync(summaryPath)?JSON.parse(readFileSync(summaryPath,'utf8')):null; const resourcesClosed=checks.length===2&&checks.every(row=>row.state==='cleaned'&&row.directoryCleared&&row.processes===0&&row.inProcessConsumers===0&&!row.launchIntent&&row.docker===0&&row.creatorStopped); const receipt={candidate:process.env.DIAGNOSTIC_HEAD,exactTwo:summary?.exactTwo===true,targetExactOne:summary?.targetExactOne===true,targetOutcome:summary?.targetOutcome??'unknown',originalVerdict:summary?.verdict??'unknown',resourcesClosed,checks,globalPostVmInventory:'unavailable; no owned Docker resources'}; writeFileSync(join(output,'closed-receipt.json'),JSON.stringify(receipt,null,2)); if(!receipt.exactTwo||!receipt.targetExactOne||!resourcesClosed)process.exitCode=1;"
      - name: Retain only safe original verdict, public failure facts and owned ledger
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-sync-prefix-safe-evidence
          path: |
            .scratch/windows-pause-diagnostic/environment.json
            .scratch/windows-pause-diagnostic/test-summary.json
            .scratch/windows-pause-diagnostic/closed-receipt.json
            .scratch/vnext-m1/lab-word-m1-*/windows-pause-failure.json
            .scratch/vnext-m1/lab-word-m1-*/owned-resources.json
          if-no-files-found: error
          retention-days: 7
