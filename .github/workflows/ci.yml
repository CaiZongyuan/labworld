name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DOCS_SOURCE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: M1 foundation and retained frontend/tooling/docs gate (no containers)
        run: pnpm check:m1
      - name: Synthetic HTTP/SSE spike smoke (formal 30-minute evidence is separate)
        run: pnpm spike:server --duration-seconds 5
      - name: Migrated and pending stage coverage
        run: node scripts/migration-stage.mjs
      - name: Keep foundation evidence and cleanup receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m1-linux-evidence
          path: .scratch/vnext-m1/
          if-no-files-found: ignore
          retention-days: 7
      - name: Keep verified documentation
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
          retention-days: 7
  windows-foundation:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Actual startup, migration, HTTP, persistence and owned process proof
        run: pnpm test:server
      - run: pnpm contracts:m1:check
      - run: pnpm spike:server --duration-seconds 5
      - name: Keep platform evidence and cleanup receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m1-windows-evidence
          path: .scratch/vnext-m1/
          if-no-files-found: ignore
          retention-days: 7
  publish-docs:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pages: write
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: docs-site
          path: apps/docs/.vitepress/dist
      - name: Publish artifact and verify matching Pages build
        env:
          DOCS_SOURCE_REF: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-docs.mjs --request-build
