name: Perf nightly
# Current M1 reports use isolated synthetic data and the new service. The full
# Web journey workload remains pending migration; frozen legacy services do not run.
on:
  schedule:
    - cron: '23 18 * * *'
  workflow_dispatch:
    inputs:
      soak_duration_secs:
        description: Synthetic M1 report duration in seconds
        default: '300'
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: perf-nightly
  cancel-in-progress: true
jobs:
  load-reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - name: Report synthetic device persistence, concurrent HTTP and two SSE readers
        run: pnpm spike:server --duration-seconds ${{ inputs.soak_duration_secs || '300' }}
      - name: Report migrated and pending coverage
        run: node scripts/migration-stage.mjs
      - name: Keep synthetic report and owned cleanup receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: m1-load-report
          path: .scratch/vnext-m1/
          if-no-files-found: ignore
          retention-days: 30
