name: labos-threejs
services:
  mailpit:
    image: axllent/mailpit:v1.31.2@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:8.10.2-alpine@sha256:3811787313eba226a2ef38658c6ccb91cd5e110edc89c37767de373120a0e5a0
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '-e', 'PING']
      interval: 2s
      timeout: 3s
      retries: 20
  rustfs:
    image: rustfs/rustfs:1.0.0@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: ['rustfs', '/data']
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-labos-local-access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-labos-local-storage-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_CONSOLE_ENABLE: 'false'
    ports:
      - '127.0.0.1:${RUSTFS_PORT:-9000}:9000'
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/logs
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '--fail',
          '--silent',
          '--head',
          'http://127.0.0.1:9000/health/ready',
        ]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 10s
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_USER: labos_threejs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-labos-local}
      POSTGRES_DB: labos_threejs
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U labos_threejs -d labos_threejs']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  rustfs-data:
  rustfs-logs:
