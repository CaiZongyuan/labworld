services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.161.0@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    profiles: [observability]
    command: ['--config=/etc/otel/config.yaml']
    user: '0:0'
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    read_only: true
    mem_limit: 256m
    ports: ['127.0.0.1:${TELEMETRY_HTTP_PORT:-4318}:4318']
    volumes:
      - ./deploy/observability/collector.yaml:/etc/otel/config.yaml:ro
      - ${TELEMETRY_LOG_DIRECTORY:-./.runtime/telemetry}:/logs:ro
      - collector-data:/var/otel
    depends_on: [tempo, loki]
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [observability]
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    ports: ['127.0.0.1:${PROMETHEUS_PORT:-9090}:9090']
    volumes:
      - ./deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    profiles: [observability]
    command: ['-config.file=/etc/loki/config.yaml']
    ports: ['127.0.0.1:${LOKI_PORT:-3100}:3100']
    volumes:
      - ./deploy/observability/loki.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
  tempo:
    image: grafana/tempo:3.0.3@sha256:0296560ac66f8a3600d7fb3014a52c189d4d9c3549ad6ff441bf2409855d68d5
    profiles: [observability]
    command: ['-target=all', '-config.file=/etc/tempo.yaml']
    ports: ['127.0.0.1:${TEMPO_PORT:-3200}:3200']
    volumes:
      - ./deploy/observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
  grafana:
    image: grafana/grafana:13.2.2@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    profiles: [observability]
    ports: ['127.0.0.1:${GRAFANA_PORT:-3300}:3000']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
volumes:
  collector-data:
  prometheus-data:
  loki-data:
  tempo-data:
  grafana-data:
